<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">From Canvas deadlines to verified calendar events</title>
  <desc id="desc">First discover all Canvas coursework with complete pagination. Then read automation-owned Google events and plan changes. Only after successful preflight, create or update and read back events, then delete stale future owned events. Failed preflight causes no Calendar writes. A dry-run stops at the plan. Credentials and state stay on the Mac; APIs require the internet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#167D78"/></marker>
  </defs>
  <rect width="1200" height="570" rx="24" fill="#F7F5EF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="48" y="55" fill="#167D78" font-size="15" font-weight="700" letter-spacing="2">HOW IT WORKS</text>
    <text x="48" y="101" fill="#132B36" font-size="32" font-weight="700">Read completely. Plan first. Verify each write.</text>
    <text x="48" y="136" fill="#52656D" font-size="19">One-way reconciliation, driven by a local Python program.</text>
    <rect x="48" y="178" width="330" height="244" rx="16" fill="#FFFFFF" stroke="#D5DEDA"/>
    <rect x="435" y="178" width="330" height="244" rx="16" fill="#FFFFFF" stroke="#D5DEDA"/>
    <rect x="822" y="178" width="330" height="244" rx="16" fill="#132B36"/>
    <path d="M390 300h32" stroke="#167D78" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M777 300h32" stroke="#167D78" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="82" cy="214" r="17" fill="#DFF0EB"/><text x="82" y="220" text-anchor="middle" fill="#167D78" font-size="17" font-weight="700">1</text>
    <circle cx="469" cy="214" r="17" fill="#DFF0EB"/><text x="469" y="220" text-anchor="middle" fill="#167D78" font-size="17" font-weight="700">2</text>
    <circle cx="856" cy="214" r="17" fill="#F2AE72"/><text x="856" y="220" text-anchor="middle" fill="#132B36" font-size="17" font-weight="700">3</text>
    <text x="72" y="268" fill="#132B36" font-size="26" font-weight="700">Discover Canvas</text>
    <text x="72" y="304" fill="#52656D" font-size="19">Courses, assignments, planner</text>
    <text x="72" y="335" fill="#52656D" font-size="19">Complete pagination</text>
    <text x="72" y="366" fill="#52656D" font-size="19">Future student-specific dates</text>
    <text x="72" y="399" fill="#167D78" font-size="16" font-weight="700">READ ONLY</text>
    <text x="459" y="268" fill="#132B36" font-size="26" font-weight="700">Read + plan</text>
    <text x="459" y="304" fill="#52656D" font-size="19">Find owned Google events</text>
    <text x="459" y="335" fill="#52656D" font-size="19">Match stable source keys</text>
    <text x="459" y="366" fill="#52656D" font-size="19">Plan create / update / delete</text>
    <text x="459" y="399" fill="#167D78" font-size="16" font-weight="700">DRY-RUN STOPS HERE</text>
    <text x="846" y="268" fill="#FFFFFF" font-size="26" font-weight="700">Apply + verify</text>
    <text x="846" y="304" fill="#D7E4E5" font-size="19">Create or update, then read back</text>
    <text x="846" y="335" fill="#D7E4E5" font-size="19">Verify unchanged events too</text>
    <text x="846" y="366" fill="#D7E4E5" font-size="19">Only then: stale-future deletion</text>
    <text x="846" y="399" fill="#F2AE72" font-size="16" font-weight="700">OWNED EVENTS ONLY</text>
    <rect x="48" y="447" width="1104" height="48" rx="10" fill="#F4E5D7"/>
    <text x="600" y="478" text-anchor="middle" fill="#754824" font-size="19" font-weight="600">Incomplete preflight → no Calendar writes. Past events are retained.</text>
    <text x="600" y="537" text-anchor="middle" fill="#52656D" font-size="17">On your Mac: Keychain credentials · SQLite state · launchd scheduling   /   Online: Canvas + Google APIs</text>
  </g>
</svg>
