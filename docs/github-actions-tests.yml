name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked python -m compileall -q src tests
