[project]
name = "canvas-calendar-sync"
version = "0.2.0"
description = "Sync Canvas coursework deadlines to Google Calendar on macOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-api-python-client==2.179.0",
  "google-auth==2.40.3",
  "google-auth-oauthlib==1.2.2",
  "keyring==25.6.0",
]

[project.scripts]
canvas-calendar-sync = "canvas_calendar_sync.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_calendar_sync"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
